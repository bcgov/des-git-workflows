name: WordPress PHP Testing

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use (defaults to 20)'
        required: false
        type: string
        default: '20'

jobs:
  test-php:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Composer dependencies
        run: composer install

      - name: Install Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install npm dependencies (for wp-env)
        run: npm ci

      - name: Start wp-env
        run: npm run wp-env start

      - name: Run PHP unit tests
        run: npm run test:unit:php
