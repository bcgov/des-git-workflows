name: JavaScript Testing

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use (defaults to 20)'
        required: false
        type: string
        default: '20'

jobs:
  test-js:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install node dependencies
        run: |
          npm ci
          # Install dependencies in subdirectories
          for dir in $(find . -type f -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;); do
            if [ "$dir" != "." ]; then
              echo "Installing dependencies in $dir"
              cd $dir
              npm ci
              cd -
            fi
          done

      - name: Install Composer dependencies
        run: composer install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start wp-env
        run: npm run wp-env start

      - name: Run JS unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: artifacts/test-results/
          retention-days: 30